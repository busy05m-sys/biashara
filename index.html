<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KCL — Mfumo wa Biashara</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700;900&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap');

:root{
  --forest:#173C30;
  --forest-2:#0F2A22;
  --gold:#C9962A;
  --gold-2:#E4B45A;
  --cream:#F6F2E7;
  --paper:#FFFFFF;
  --ink:#1B211D;
  --muted:#6B7269;
  --line:#E4DFD0;
  --danger:#B3432B;
  --danger-bg:#FBEBE5;
  --ok:#2E6B4F;
  --ok-bg:#E7F1EA;
  --warn:#B9821F;
  --warn-bg:#FBF2DE;
  --radius:10px;
  --shadow:0 1px 2px rgba(23,60,48,.06), 0 6px 20px rgba(23,60,48,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--cream);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- APP LAYOUT ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:230px;flex-shrink:0;
  background:linear-gradient(180deg,var(--forest),var(--forest-2));
  color:#EFEAE0;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;
}
.brand{padding:22px 18px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.brand-name{font-family:'Fraunces',serif;font-weight:800;font-size:22px;letter-spacing:.5px;color:#fff;}
.brand-sub{font-size:10.5px;color:var(--gold-2);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}

.nav{padding:10px 10px;flex:1;}
.nav-group{margin-top:14px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#9CA99E;padding:0 10px;margin-bottom:6px;font-weight:700;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:600;
  color:#D9E0D6;text-decoration:none;margin-bottom:2px;
  border:1px solid transparent;
}
.nav-item:hover{background:rgba(255,255,255,.06);}
.nav-item.active{background:var(--gold);color:var(--forest-2);}
.nav-item .ic{width:16px;text-align:center;font-size:14px;}

.sidebar-foot{padding:12px 18px;font-size:11px;color:#93A092;border-top:1px solid rgba(255,255,255,.08);}
.sidebar-foot b{color:var(--gold-2);}

.main{flex:1;min-width:0;}
.topbar{
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  position:sticky;top:0;z-index:5;
}
.topbar h1{font-size:19px;margin:0;font-weight:700;}
.topbar .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
.branch-select{display:flex;align-items:center;gap:8px;}
.branch-select select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--forest);}

.content{padding:22px 26px 60px;}

/* ---------- CARDS / GRID ---------- */
.grid{display:grid;gap:14px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:repeat(2,1fr);}}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.card h3{margin:0 0 4px;font-size:14px;}
.card-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-title h2{font-size:16px;margin:0;}

.stat{padding:16px;}
.stat .label{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700;}
.stat .num{font-family:'Fraunces',serif;font-size:26px;font-weight:700;margin-top:6px;color:var(--forest);}
.stat .delta{font-size:11.5px;margin-top:4px;font-weight:600;}
.stat.accent{border-top:3px solid var(--gold);}
.stat.danger .num{color:var(--danger);}
.stat.ok .num{color:var(--ok);}

/* ---------- FORMS ---------- */
label{display:block;font-size:12px;font-weight:700;color:var(--forest);margin-bottom:4px;}
.field{margin-bottom:12px;}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#FBFAF6;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold-2);outline-offset:0;border-color:var(--gold);}
textarea{resize:vertical;min-height:60px;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}
.hint{font-size:11px;color:var(--muted);margin-top:3px;}
.checkline{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;}
.checkline input{width:auto;}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:8px;border:1px solid transparent;
  font-size:13px;font-weight:700;background:var(--forest);color:#fff;transition:.15s;
}
.btn:hover{background:var(--forest-2);}
.btn.gold{background:var(--gold);color:var(--forest-2);}
.btn.gold:hover{background:var(--gold-2);}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--forest);}
.btn.ghost:hover{background:#F1EEE2;}
.btn.danger{background:var(--danger);}
.btn.sm{padding:6px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- TABLES ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);font-weight:700;}
td{padding:9px 10px;border-bottom:1px solid var(--line);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FBF9F2;}
.table-wrap{overflow-x:auto;}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13px;}

.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
.badge.ok{background:var(--ok-bg);color:var(--ok);}
.badge.warn{background:var(--warn-bg);color:var(--warn);}
.badge.danger{background:var(--danger-bg);color:var(--danger);}
.badge.gray{background:#EEEAE0;color:var(--muted);}

.bar-track{background:#EEEAE0;border-radius:20px;height:7px;overflow:hidden;}
.bar-fill{height:100%;border-radius:20px;}

.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.tabbtn{padding:9px 14px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;background:transparent;border-radius:0;}
.tabbtn.active{color:var(--forest);border-bottom-color:var(--gold);}

.modal-bg{position:fixed;inset:0;background:rgba(15,30,24,.55);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
.modal{background:#fff;border-radius:14px;max-width:620px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal.wide{max-width:820px;}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.modal-head h2{margin:0;font-size:17px;}
.xbtn{background:none;border:none;font-size:20px;color:var(--muted);line-height:1;padding:2px 6px;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--forest);color:#fff;padding:12px 18px;border-radius:9px;font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:100;animation:slidein .2s ease;}
@keyframes slidein{from{transform:translateY(10px);opacity:0;}to{transform:translateY(0);opacity:1;}}

.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.pill{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--forest);}
.pill.active{background:var(--forest);color:#fff;border-color:var(--forest);}

.alert-box{border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:10px;display:flex;gap:10px;align-items:flex-start;}
.alert-box.danger{background:var(--danger-bg);color:#7A2A18;}
.alert-box.warn{background:var(--warn-bg);color:#7A5714;}
.alert-box.ok{background:var(--ok-bg);color:#1E4A36;}
.alert-box .ic{font-size:16px;}

.advice-item{padding:12px 14px;border-left:3px solid var(--gold);background:#FBF8F0;border-radius:0 8px 8px 0;margin-bottom:8px;font-size:13px;}
.advice-item b{color:var(--forest);}

.linebtn{background:none;border:none;color:var(--danger);font-size:16px;padding:2px 6px;}

/* Logo */
.kcl-logo{display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Print area */
#printArea{display:none;}
@media print{
  #app,.modal-bg{display:none !important;}
  #printArea{display:block !important;}
  body{background:#fff;}
  .no-print{display:none !important;}
}
.doc-page{max-width:760px;margin:0 auto;background:#fff;padding:34px;}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--forest);padding-bottom:14px;margin-bottom:18px;}
.doc-title{font-family:'Fraunces',serif;font-size:22px;font-weight:800;color:var(--forest);letter-spacing:.5px;}
.doc-meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.5;}
.doc-parties{display:flex;justify-content:space-between;gap:20px;margin-bottom:20px;font-size:13px;}
.doc-parties .blk{flex:1;}
.doc-parties .blk h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);}
.doc-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
.doc-table th{background:var(--forest);color:#fff;font-size:11px;padding:8px;text-align:left;}
.doc-table td{padding:8px;border-bottom:1px solid var(--line);font-size:13px;}
.doc-total-row{display:flex;justify-content:flex-end;}
.doc-total-box{width:260px;font-size:13px;}
.doc-total-box .r{display:flex;justify-content:space-between;padding:5px 0;}
.doc-total-box .r.final{border-top:2px solid var(--forest);font-weight:800;font-size:15px;color:var(--forest);padding-top:8px;}
.doc-foot{margin-top:30px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);}
.sign-line{margin-top:36px;border-top:1px solid var(--ink);width:180px;padding-top:4px;font-size:11px;}

.scroll-x{overflow-x:auto;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#D8D2BF;border-radius:20px;}

.section-title{display:flex;align-items:center;gap:8px;margin:26px 0 12px;}
.section-title h2{font-size:16px;margin:0;}
.section-title .line{flex:1;height:1px;background:var(--line);}

.two-col{display:grid;grid-template-columns:1.3fr .9fr;gap:16px;}
@media(max-width:1000px){.two-col{grid-template-columns:1fr;}}
</style>

<!-- ═══ FIREBASE (Auth + Firestore) ═══ -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCicG0RsPh2ygH2pUpaV15as9WA8GMDh3M",
    authDomain: "kiseja-cl-biashara.firebaseapp.com",
    projectId: "kiseja-cl-biashara",
    storageBucket: "kiseja-cl-biashara.firebasestorage.app",
    messagingSenderId: "325593564374",
    appId: "1:325593564374:web:b677f42e848b6354b1f577"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db   = firebase.firestore();

  let currentUID = null, currentBusinessId = null, currentRole = null, currentUserEmail = null;

  function swAuthErr(code){
    const map = {
      'auth/email-already-in-use':'Barua pepe hii tayari ina akaunti. Jaribu "Ingia" badala ya kujisajili.',
      'auth/invalid-email':'Barua pepe si sahihi.',
      'auth/weak-password':'Nenosiri ni fupi mno (angalau herufi 6).',
      'auth/user-not-found':'Akaunti haipo kwa barua pepe hii.',
      'auth/wrong-password':'Nenosiri si sahihi.',
      'auth/invalid-credential':'Barua pepe au nenosiri si sahihi.',
      'auth/missing-password':'Andika nenosiri.',
      'auth/too-many-requests':'Majaribio mengi yameshindwa. Subiri kidogo kisha jaribu tena.',
      'auth/network-request-failed':'Hitilafu ya mtandao. Angalia intaneti yako.'
    };
    return map[code] || ('Hitilafu imetokea: '+code);
  }
  function authMsg(msg,ok){
    const el=document.getElementById('auth-msg');
    if(!el)return;
    el.textContent=msg||'';
    el.style.display=msg?'block':'none';
    el.style.color = ok ? '#2E6B4F' : '#B3432B';
  }
  function setAuthBusy(busy){
    document.querySelectorAll('.auth-btn').forEach(b=>b.disabled=busy);
  }
  function doRegister(){
    const email=document.getElementById('auth-email').value.trim();
    const pass=document.getElementById('auth-password').value;
    authMsg('');
    if(!email||!pass){authMsg('Jaza barua pepe na nenosiri.');return;}
    if(pass.length<6){authMsg('Nenosiri liwe na herufi angalau 6.');return;}
    setAuthBusy(true);
    auth.createUserWithEmailAndPassword(email,pass)
      .catch(e=>authMsg(swAuthErr(e.code)))
      .finally(()=>setAuthBusy(false));
  }
  function doLogin(){
    const email=document.getElementById('auth-email').value.trim();
    const pass=document.getElementById('auth-password').value;
    authMsg('');
    if(!email||!pass){authMsg('Jaza barua pepe na nenosiri.');return;}
    setAuthBusy(true);
    auth.signInWithEmailAndPassword(email,pass)
      .catch(e=>authMsg(swAuthErr(e.code)))
      .finally(()=>setAuthBusy(false));
  }
  function doResetPassword(){
    const email=document.getElementById('auth-email').value.trim();
    if(!email){authMsg('Andika barua pepe yako juu kwanza, kisha bofya hapa tena.');return;}
    setAuthBusy(true);
    auth.sendPasswordResetEmail(email)
      .then(()=>authMsg('✅ Barua pepe ya kubadili nenosiri imetumwa. Angalia inbox yako (na Spam).',true))
      .catch(e=>authMsg(swAuthErr(e.code)))
      .finally(()=>setAuthBusy(false));
  }
  function doLogout(){
    if(confirm('Una uhakika unataka kutoka (logout)?')) auth.signOut();
  }

  // ── Ruhusa ya Kuhariri/Kufuta: Mmiliki daima ana ruhusa. Mfanyakazi anahitaji
  //    kupewa ruhusa hii wazi na Mmiliki (kupitia "Wafanyakazi" -> "Ruhusu Kuhariri/Kufuta").
  function canEditDelete(){
    if(currentRole==='Mmiliki') return true;
    const acc = (DB.staffAccounts||[]).find(x=>x.uid===currentUID);
    return !!(acc && acc.canEditDelete);
  }
  function requireEditDelete(){
    if(!canEditDelete()){ toast('⛔ Huna ruhusa ya kuhariri/kufuta taarifa. Muombe Mmiliki wa biashara akupe ruhusa hii kwenye "Wafanyakazi".'); return false; }
    return true;
  }

  // ── Multi-tenant load/save (Firestore) ────────────────────
  async function resolveUserAndBusiness(uid, email){
    const userSnap = await db.collection('users').doc(uid).get();
    if(userSnap.exists){
      const u = userSnap.data();
      currentBusinessId = u.businessId;
      currentRole = u.role;
      currentUserEmail = u.email || email;
    } else {
      // First-time: this account becomes a NEW business owner
      currentBusinessId = uid;
      currentRole = 'Mmiliki';
      currentUserEmail = email;
      await db.collection('users').doc(uid).set({
        businessId: uid, role: 'Mmiliki', email: email, createdAt: new Date().toISOString()
      });
    }
  }
  async function loadDBFromCloud(){
    const bizSnap = await db.collection('businesses').doc(currentBusinessId).get();
    if(bizSnap.exists){
      const parsed = bizSnap.data();
      const defaultSettings = DB.settings, defaultCounters = DB.settings.docCounters;
      DB = Object.assign(DB, parsed);
      DB.settings = Object.assign({}, defaultSettings, parsed.settings||{});
      DB.settings.docCounters = Object.assign({}, defaultCounters, (parsed.settings&&parsed.settings.docCounters)||{});
      DB.customers = DB.customers || [];
      DB.suppliers = DB.suppliers || [];
      DB.staffAccounts = DB.staffAccounts || [];
    } else {
      DB.staffAccounts = DB.staffAccounts || [];
      await db.collection('businesses').doc(currentBusinessId).set(DB);
    }
  }
  async function saveDBToCloud(){
    try{
      await db.collection('businesses').doc(currentBusinessId).set(DB);
    }catch(e){
      console.error('Cloud save error:', e);
      toast('⚠️ Imeshindwa kuhifadhi mtandaoni. Angalia intaneti yako.');
    }
  }

  // ── Owner creates a staff login account (without losing own session) ──
  async function createStaffAccount(email, tempPassword, name, role, canEditDelete){
    const secName = 'secondary_'+Date.now();
    const secApp = firebase.initializeApp(firebaseConfig, secName);
    const secAuth = secApp.auth();
    const secDb = secApp.firestore();
    try{
      const cred = await secAuth.createUserWithEmailAndPassword(email, tempPassword);
      const newUid = cred.user.uid;
      await secDb.collection('users').doc(newUid).set({
        businessId: currentBusinessId, role: role, email: email, name: name,
        createdAt: new Date().toISOString()
      });
      await secAuth.signOut();
      await secApp.delete();
      // back on primary session: record this staff account on the business doc
      DB.staffAccounts = DB.staffAccounts || [];
      DB.staffAccounts.push({uid:newUid, email, name, role, canEditDelete:!!canEditDelete, createdAt:new Date().toISOString()});
      await saveDBToCloud();
      return {ok:true};
    }catch(e){
      try{ await secApp.delete(); }catch(e2){}
      return {ok:false, error: swAuthErr(e.code)};
    }
  }

  auth.onAuthStateChanged(async function(user){
    const authScreen=document.getElementById('auth-screen');
    const appContent=document.getElementById('app-content');
    if(user){
      currentUID=user.uid;
      await resolveUserAndBusiness(user.uid, user.email);
      authScreen.style.display='none';
      appContent.style.display='block';
      await boot();
    } else {
      currentUID=null; currentBusinessId=null; currentRole=null; currentUserEmail=null;
      authScreen.style.display='flex';
      appContent.style.display='none';
    }
  });
</script>
</head>
<body>

<!-- ═══ AUTH SCREEN (login / register) ═══ -->
<div id="auth-screen" style="display:flex;min-height:100vh;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#173C30,#0F2A22 60%,#173C30);padding:1.2rem;font-family:'Inter',sans-serif">
  <div style="background:#FFFFFF;border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.35);
    padding:2rem 1.6rem;max-width:380px;width:100%">
    <div style="text-align:center;margin-bottom:1.4rem">
      <div style="font-size:2.2rem">🏪</div>
      <h1 style="font-size:1.1rem;font-weight:800;color:#173C30;margin-top:.3rem;font-family:'Fraunces',serif">KCL — MFUMO WA BIASHARA</h1>
      <div style="font-size:.78rem;color:#6B7269;margin-top:.2rem">Ingia kwenye akaunti yako, au anzisha biashara mpya</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:.7rem">
      <div>
        <label style="font-size:.72rem;font-weight:700;color:#6B7269;text-transform:uppercase;letter-spacing:.05em">Barua Pepe</label>
        <input id="auth-email" type="email" placeholder="wewe@mfano.com" autocomplete="email"
          style="width:100%;padding:.65rem .8rem;border:1.5px solid #E4DFD0;border-radius:8px;font:inherit;font-size:.9rem;margin-top:.25rem">
      </div>
      <div>
        <label style="font-size:.72rem;font-weight:700;color:#6B7269;text-transform:uppercase;letter-spacing:.05em">Nenosiri</label>
        <input id="auth-password" type="password" placeholder="Angalau herufi 6" autocomplete="current-password"
          style="width:100%;padding:.65rem .8rem;border:1.5px solid #E4DFD0;border-radius:8px;font:inherit;font-size:.9rem;margin-top:.25rem">
      </div>
      <div id="auth-msg" style="display:none;font-size:.8rem;font-weight:600;padding:.5rem .7rem;background:#FBEBE5;border-radius:6px"></div>
      <button class="auth-btn" onclick="doLogin()"
        style="background:#173C30;color:#fff;border:none;padding:.75rem;border-radius:8px;font:inherit;font-weight:700;font-size:.92rem;cursor:pointer;margin-top:.3rem">
        Ingia
      </button>
      <button class="auth-btn" onclick="doRegister()"
        style="background:#fff;color:#173C30;border:1.5px solid #173C30;padding:.75rem;border-radius:8px;font:inherit;font-weight:700;font-size:.92rem;cursor:pointer">
        Jisajili (Anzisha Biashara Mpya)
      </button>
      <a class="auth-btn" onclick="doResetPassword()"
        style="text-align:center;font-size:.8rem;color:#173C30;cursor:pointer;margin-top:.2rem;text-decoration:underline">
        Umesahau nenosiri?
      </a>
    </div>
    <div style="margin-top:1rem;font-size:.72rem;color:#6B7269;text-align:center;line-height:1.4">
      Kama wewe ni mfanyakazi (mgavi, mhasibu, n.k.), tumia barua pepe na nenosiri alilokupa mwajiri wako — bofya "Ingia".

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.onerror = ()=>reject(r.error);
    r.readAsDataURL(file);
  });
}

/* -------- Merge-import: bring data from a branch computer without wiping the main computer's data -------- */
function mergeArraysById(local, incoming){
  local = local||[]; incoming = incoming||[];
  const ids = new Set(local.map(x=>x.id));
  let added = 0;
  incoming.forEach(item=>{
    if(item && item.id && !ids.has(item.id)){ local.push(item); ids.add(item.id); added++; }
  });
  return {list:local, added};
}
async function importMergeFile(file){
  try{
    const text = await file.text();
    const incoming = JSON.parse(text);
    const report = [];
    ['branches','products','purchases','sales','expenses','employees','documents','customers','suppliers'].forEach(key=>{
      const res = mergeArraysById(DB[key], incoming[key]);
      DB[key] = res.list;
      if(res.added>0) report.push(`${res.added} mpya kwenye ${key}`);
    });
    await saveDB();
    render();
    toast(report.length? `✅ Data imeunganishwa: ${report.join(', ')}` : 'ℹ️ Hakuna data mpya iliyopatikana kwenye faili hili');
  }catch(e){
    console.error(e);
    toast('⚠️ Imeshindwa kusoma faili. Hakikisha ni faili sahihi la JSON kutoka mfumo huu.');
  }
}

function branchName(id){ if(id==='all'||!id) return "Tawi Kuu/Zote"; const b=DB.branches.find(x=>x.id===id); return b? b.name : "—"; }
function filteredByBranch(arr){
  if(activeBranch==='all') return arr;
  return arr.filter(x=>x.branchId===activeBranch);
}
function product(id){ return DB.products.find(p=>p.id===id); }

function computeCosts(p){
  const unitCost = (Number(p.purchaseCost)||0)+(Number(p.packagingCost)||0)+(Number(p.transportCost)||0)+(Number(p.handlingCost)||0);
  return unitCost;
}
function computePrices(p){
  const cost = computeCosts(p);
  const retail = cost*(1+(Number(p.retailMargin)||0)/100);
  const wholesale = cost*(1+(Number(p.wholesaleMargin)||0)/100);
  const retailWithTax = retail*(1+(Number(p.taxRate)||0)/100);
  const wholesaleWithTax = wholesale*(1+(Number(p.taxRate)||0)/100);
  return {cost, retail, wholesale, retailWithTax, wholesaleWithTax};
}
function stockStatus(p){
  const threshold = (Number(p.openingStock)||0)*0.10;
  const ratio = p.openingStock>0 ? p.currentStock/p.openingStock : 1;
  if(p.currentStock<=threshold && p.openingStock>0) return {level:'danger', label:'AMEISHA (chini ya 10%)'};
  if(ratio<=0.25) return {level:'warn', label:'Inapungua'};
  return {level:'ok', label:'Ipo salama'};
}

function salesInRange(fromD,toD){
  return DB.sales.filter(s=>{
    if(activeBranch!=='all' && s.branchId!==activeBranch) return false;
    if(fromD && s.date<fromD) return false;
    if(toD && s.date>toD) return false;
    return true;
  });
}
function purchasesInRange(fromD,toD){
  return DB.purchases.filter(s=>{
    if(activeBranch!=='all' && s.branchId!==activeBranch) return false;
    if(fromD && s.date<fromD) return false;
    if(toD && s.date>toD) return false;
    return true;
  });
}
function expensesInRange(fromD,toD){
  return DB.expenses.filter(s=>{
    if(activeBranch!=='all' && s.branchId!==activeBranch) return false;
    if(fromD && s.date<fromD) return false;

    return true;

}

function salesTotal(list){ return list.reduce((a,s)=>a+Number(s.total||0),0); }
function purchasesTotal(list){ return list.reduce((a,s)=>a+Number(s.total||0),0); }
function cogsOfSales(list){
  // cost of goods sold based on product's unit cost at time of sale (stored on sale record)
  return list.reduce((a,s)=>a+ (Number(s.unitCost||0) * Number(s.qty||0)) ,0);
}
function expensesTotal(list){ return list.reduce((a,s)=>a+Number(s.amount||0),0); }

function tabDashboard(){

  const thisMonth = now.toISOString().slice(0,7);

  const monthExp = filteredByBranch(DB.expenses).filter(s=>monthKey(s.date)===thisMonth);
  const revenue = salesTotal(monthSales);
  const cogs = cogsOfSales(monthSales);
  const gross = revenue - cogs;
  const exp = expensesTotal(monthExp);
  const net = gross - exp;
  const prods = filteredByBranch(DB.products);
  const lowStock = prods.filter(p=>stockStatus(p).level==='danger');
  const warnStock = prods.filter(p=>stockStatus(p).level==='warn');

  const totalDebt = DB.customers.reduce((a,c)=>a+Math.max(0,customerDebt(c.name)),0);

    <div class="card stat ok"><div class="label">Faida Ghafi (Gross)</div><div class="num">${fmt(gross)}</div><div class="delta" style="color:var(--muted)">Mauzo − Gharama za bidhaa</div></div>

      ${lowStock.map(p=>`<div class="alert-box danger"><span class="ic">🔴</span><div><b>${esc(p.name)}</b> imebaki ${fmtN(p.currentStock)} ${esc(p.unit)} tu — chini ya asilimia 10 ya stock ya awali. Nunua zaidi haraka.</div></div>`).join('')}
      ${warnStock.map(p=>`<div class="alert-box warn"><span class="ic">🟠</span><div><b>${esc(p.name)}</b> inapungua (${fmtN(p.currentStock)} ${esc(p.unit)} imebaki). Panga manunuzi mapema.</div></div>`).join('')}
    </div>

  </div>

}

function bestWorstMini(){
  const agg = {};
  filteredByBranch(DB.sales).forEach(s=>{
    agg[s.productId] = agg[s.productId] || {qty:0, rev:0};
    agg[s.productId].qty += Number(s.qty||0);
    agg[s.productId].rev += Number(s.total||0);
  });
  const rows = Object.entries(agg).map(([pid,v])=>({p:product(pid), ...v})).filter(r=>r.p);
  if(rows.length===0) return `<div class="empty">Bado hakuna data ya mauzo.</div>`;
  rows.sort((a,b)=>b.qty-a.qty);
  const best = rows[0], worst = rows[rows.length-1];
  const maxQty = Math.max(...rows.map(r=>r.qty),1);
  return `
    <div style="margin-bottom:14px;">
      <div style="font-size:12px;font-weight:700;color:var(--ok);margin-bottom:4px;">🟢 Inauzika Zaidi: ${esc(best.p.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(best.qty/maxQty*100)}%;background:var(--ok);"></div></div>
      <div class="hint">${fmtN(best.qty)} ${esc(best.p.unit)} zimeuzwa · Mapato ${fmt(best.rev)}</div>
    </div>
    <div>
      <div style="font-size:12px;font-weight:700;color:var(--danger);margin-bottom:4px;">🔴 Inauzika Kidogo: ${esc(worst.p.name)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(worst.qty/maxQty*100)}%;background:var(--danger);"></div></div>
      <div class="hint">${fmtN(worst.qty)} ${esc(worst.p.unit)} zimeuzwa · Mapato ${fmt(worst.rev)}</div>
    </div>
  `;
}

function businessAdvice(){
  const tips = [];
  const prods = filteredByBranch(DB.products);
  const sales = filteredByBranch(DB.sales);
  const lowStock = prods.filter(p=>stockStatus(p).level==='danger');
  lowStock.forEach(p=>tips.push(`📦 <b>${esc(p.name)}</b> imebaki chini ya asilimia 10 ya stock — panga manunuzi ya haraka ili usikose mauzo.`));

  // slow movers with stock but no recent sale in 30 days
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-30);
  const cutoffStr = cutoff.toISOString().slice(0,10);
  prods.forEach(p=>{
    const recent = sales.filter(s=>s.productId===p.id && s.date>=cutoffStr);
    if(p.currentStock>0 && recent.length===0){
      const everSold = sales.some(s=>s.productId===p.id);
      if(everSold) tips.push(`🐢 <b>${esc(p.name)}</b> haijauzwa kwa siku 30 zilizopita ijapokuwa ipo stock — fikiria punguzo la bei au tangazo la kuvutia wateja.`);
    }
  });

  // margin check
  prods.forEach(p=>{
    const pr = computePrices(p);
    if(pr.cost>0){
      const marginPct = ((pr.retail-pr.cost)/pr.cost)*100;
      if(marginPct < 10) tips.push(`💡 Faida ya <b>${esc(p.name)}</b> ni ndogo (chini ya 10%). Angalia kama gharama za usafi/usafiri zimeongezeka na urekebishe bei.`);
    }
  });

  // profit trend
  const thisMonth = todayStr().slice(0,7);
  const mSales = sales.filter(s=>monthKey(s.date)===thisMonth);
  const mPurch = filteredByBranch(DB.purchases).filter(s=>monthKey(s.date)===thisMonth);
  const mExp = filteredByBranch(DB.expenses).filter(s=>monthKey(s.date)===thisMonth);
  const net = salesTotal(mSales)-cogsOfSales(mSales)-expensesTotal(mExp);
  if(net<0) tips.push(`🔻 Mwezi huu biashara ina hasara halisi (Net Loss). Punguza gharama za uendeshaji zisizo za lazima au ongeza bei/mauzo.`);
  else if(net>0) tips.push(`✅ Mwezi huu biashara ina faida halisi ya ${fmt(net)}. Endelea na mwenendo huu, fikiria kuwekeza sehemu ya faida kwenye stock zaidi.`);

  if(prods.length===0) tips.push(`🆕 Anza kwa kuongeza bidhaa zako katika sehemu ya "Bidhaa & Bei" ili mfumo uanze kukupa uchambuzi kamili.`);
  if(sales.length>3){
    const agg = {};
    sales.forEach(s=>{agg[s.productId]=(agg[s.productId]||0)+Number(s.qty||0);});
    const top = Object.entries(agg).sort((a,b)=>b[1]-a[1])[0];
    if(top){ const p=product(top[0]); if(p) tips.push(`📈 <b>${esc(p.name)}</b> ndiyo bidhaa inayoongoza kwa mauzo — hakikisha huikosi stock kamwe.`); }
  }
  return tips;
}

function saveProduct(id, isNew){
  const tax = document.getElementById('f_tax').value;
  const taxVal = tax==='custom' ? (Number(document.getElementById('f_tax_custom').value)||0) : Number(tax);
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('⚠️ Weka jina la bidhaa'); return; }
  const existing = DB.products.find(x=>x.id===id);
  const data = {
    id, name,
    category: document.getElementById('f_cat').value.trim(),
    unit: document.getElementById('f_unit').value,
    branchId: existing ? existing.branchId : activeBranch,
    purchaseCost: Number(document.getElementById('f_pc').value)||0,
    packagingCost: Number(document.getElementById('f_pack').value)||0,
    transportCost: Number(document.getElementById('f_transport').value)||0,
    handlingCost: Number(document.getElementById('f_handling').value)||0,
    taxRate: taxVal,
    retailMargin: Number(document.getElementById('f_rm').value)||0,
    wholesaleMargin: Number(document.getElementById('f_wm').value)||0,
    openingStock: Number(document.getElementById('f_open').value)||0,
    currentStock: Number(document.getElementById('f_curr').value)||0,
  };
  const idx = DB.products.findIndex(p=>p.id===id);
  if(idx>=0) DB.products[idx] = Object.assign(DB.products[idx], data);
  else DB.products.push(data);
  saveDB();
  document.querySelector('.modal-bg').remove();
  toast('✅ Bidhaa imehifadhiwa');
  render();
}
function deleteProduct(id){
  if(!requireEditDelete()) return;
  if(!confirm('Una uhakika unataka kufuta bidhaa hii?')) return;
  DB.products = DB.products.filter(p=>p.id!==id);
  saveDB(); render(); toast('🗑️ Bidhaa imefutwa');
}

function savePurchase(){
  const productId = document.getElementById('pu_prod').value;
  const qty = Number(document.getElementById('pu_qty').value)||0;
  const unitCost = Number(document.getElementById('pu_cost').value)||0;
  if(qty<=0){ toast('⚠️ Weka kiasi sahihi'); return; }
  const rec = {
    id:uid('pu'), productId, qty, unitCost, total:qty*unitCost,
    date:document.getElementById('pu_date').value||todayStr(),
    supplier:document.getElementById('pu_supplier').value.trim(),
    branchId: activeBranch
  };
  DB.purchases.push(rec);
  const p=product(productId);
  if(p){ p.currentStock=(Number(p.currentStock)||0)+qty; if(!p.openingStock) p.openingStock=p.currentStock; }
  if(rec.supplier && !DB.suppliers.some(s=>s.branchId===activeBranch && s.name.toLowerCase()===rec.supplier.toLowerCase())){
    DB.suppliers.push({id:uid('sup'), name:rec.supplier, phone:'', notes:'', branchId:activeBranch});
  }
  saveDB(); document.querySelector('.modal-bg').remove(); toast('✅ Manunuzi yamerekodiwa, stock imeongezwa'); render();
}
function deletePurchase(id){
  if(!requireEditDelete()) return;
  if(!confirm('Futa rekodi hii ya manunuzi?')) return;
  const rec = DB.purchases.find(p=>p.id===id);
  if(rec){ const p=product(rec.productId); if(p) p.currentStock=Math.max(0,(Number(p.currentStock)||0)-Number(rec.qty||0)); }
  DB.purchases = DB.purchases.filter(p=>p.id!==id);
  saveDB(); render(); toast('🗑️ Imefutwa');
}

  const employees = filteredByBranch(DB.employees);

  modal.innerHTML=`<div class="modal">
    <div class="modal-head"><h2>💰 Rekodi Mauzo — ${esc(branchName(activeBranch))}</h2><button class="xbtn" onclick="this.closest('.modal-bg').remove()">✕</button></div>
    <div class="field"><label>Aina ya Mauzo</label>

        <button type="button" class="pill active" id="pill_reja" onclick="setSaleType('Reja Reja')">Reja Reja</button>

      </div>
    </div>
    <div class="field"><label>Bidhaa</label><select id="sa_prod" onchange="saPrefill()">${prods.map(p=>`<option value="${p.id}">${esc(p.name)} (Ipo: ${fmtN(p.currentStock)} ${esc(p.unit)})</option>`).join('')}</select></div>
    <div class="row">
      <div class="field"><label>Kiasi</label><input id="sa_qty" type="number" value="1" oninput="saCalc()"></div>
      <div class="field"><label>Bei kwa Kipimo</label><input id="sa_price" type="number" value="0" oninput="saCalc()"></div>

      <div class="field"><label>Tarehe</label><input id="sa_date" type="date" value="${todayStr()}"></div>

    <div class="field"><label>Muuzaji (Mfanyakazi)</label><select id="sa_seller"><option value="">— Hakuna —</option>${employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
    <div class="row">
      <div class="field"><label>Njia ya Malipo</label><select id="sa_paymethod">${PAYMENT_METHODS.map(m=>`<option>${m}</option>`).join('')}</select></div>
      <div class="field"><label>Hali ya Malipo</label>
        <select id="sa_paystatus" onchange="saPayStatusChange()">
          <option>Kamili</option><option>Sehemu</option><option>Deni</option>
        </select>
      </div>
    </div>
    <div class="field" id="sa_paidwrap" style="display:none;"><label>Kiasi Kilicholipwa</label><input id="sa_paid" type="number" value="0" oninput="saCalc()"></div>

  window.saPrefill=function(){
    const p=product(document.getElementById('sa_prod').value);

    let paid = st==='Kamili'? total : Number(document.getElementById('sa_paid').value)||0;
    const bal = total-paid;
    let debtLine = bal>0 ? `<div style="color:var(--danger);margin-top:4px;">Deni linalobaki: <b>${fmt(bal)}</b></div>` : '';
    document.getElementById('sa_total').innerHTML = `Jumla ya Mauzo: <b>${fmt(total)}</b>${debtLine}${warn}`;
  };
  saPrefill();
}
function saveSale(){
  const productId = document.getElementById('sa_prod').value;
  const qty = Number(document.getElementById('sa_qty').value)||0;
  const unitPrice = Number(document.getElementById('sa_price').value)||0;
  const p = product(productId);
  if(qty<=0){ toast('⚠️ Weka kiasi sahihi'); return; }
  const total = qty*unitPrice;
  const payStatus = document.getElementById('sa_paystatus').value;
  const amountPaid = payStatus==='Kamili' ? total : (Number(document.getElementById('sa_paid').value)||0);
  const customer = document.getElementById('sa_customer').value.trim();
  const rec = {
    id:uid('sa'), productId, qty, unitPrice, total,
    unitCost: p?computeCosts(p):0,
    type: window._saleType||'Reja Reja',
    date:document.getElementById('sa_date').value||todayStr(),
    customer, branchId: activeBranch,
    sellerId: document.getElementById('sa_seller').value,
    paymentMethod: document.getElementById('sa_paymethod').value,
    paymentStatus: payStatus, amountPaid
  };
  DB.sales.push(rec);
  if(p) p.currentStock = Math.max(0,(Number(p.currentStock)||0)-qty);
  if(customer && !DB.customers.some(c=>c.branchId===activeBranch && c.name.toLowerCase()===customer.toLowerCase())){
    DB.customers.push({id:uid('cus'), name:customer, phone:'', address:'', notes:'', branchId:activeBranch});
  }
  saveDB(); document.querySelector('.modal-bg').remove(); toast('✅ Mauzo yamerekodiwa'); render();
}
function deleteSale(id){
  if(!requireEditDelete()) return;
  if(!confirm('Futa rekodi hii ya mauzo?')) return;
  const rec = DB.sales.find(p=>p.id===id);
  if(rec){ const p=product(rec.productId); if(p) p.currentStock=(Number(p.currentStock)||0)+Number(rec.qty||0); }
  DB.sales = DB.sales.filter(p=>p.id!==id);
  saveDB(); render(); toast('🗑️ Imefutwa');
}

function setDocType(t){ docType=t; render(); }
function addDocItem(){
  const bp = filteredByBranch(DB.products);
  docItems.push({productId: bp[0]?bp[0].id:'', qty:1, price:0, saleType:'Reja Reja'});
  renderDocItems();
}
function renderDocItems(){
  const host = document.getElementById('dc_items');
  if(!host) return;
  if(docItems.length===0) addDocItem();
  host.innerHTML = docItems.map((it,i)=>{
    const p = product(it.productId);
    return `<div class="row" style="align-items:flex-end;margin-bottom:6px;">
      <div class="field" style="flex:2;margin-bottom:0;"><label>Bidhaa</label>
        <select onchange="docItemChange(${i},'productId',this.value)">
          ${filteredByBranch(DB.products).map(pp=>`<option value="${pp.id}" ${it.productId===pp.id?'selected':''}>${esc(pp.name)}</option>`).join('')}

    </div>`;
  }).join('');

function docItemChange(i,field,val){
  docItems[i][field] = field==='productId'?val:Number(val);
  if(field==='productId'){ const p=product(val); if(p){ const pr=computePrices(p); docItems[i].price = Math.round(pr.retailWithTax); } }
  renderDocItems();
}
function removeDocItem(i){ docItems.splice(i,1); renderDocItems(); }
function docCalcTotal(){
  const total = docItems.reduce((a,it)=>a+ (Number(it.qty)||0)*(Number(it.price)||0),0);
  const el = document.getElementById('dc_total');
  if(el) el.innerHTML = `Jumla: <b>${fmt(total)}</b>`;
}

function nextDocNumber(type){
  const map={'Profoma Invoice':'proforma','Tax Invoice':'tax','Delivery Note':'delivery','Receipt':'receipt'};
  const key = map[type];
  DB.settings.docCounters[key] = (DB.settings.docCounters[key]||0)+1;
  const prefix = {'Profoma Invoice':'PF','Tax Invoice':'TX','Delivery Note':'DN','Receipt':'RC'}[type];
  return `${prefix}-${String(DB.settings.docCounters[key]).padStart(4,'0')}`;
}

function generateDocument(){
  if(!requireBranch()) return;
  if(docItems.length===0){ toast('⚠️ Ongeza bidhaa kwanza'); return; }
  const total = docItems.reduce((a,it)=>a+ (Number(it.qty)||0)*(Number(it.price)||0),0);
  const rec = {
    id:uid('doc'), type:docType, number: nextDocNumber(docType),
    date: document.getElementById('dc_date').value||todayStr(),
    customer: document.getElementById('dc_customer').value.trim(),
    phone: document.getElementById('dc_phone').value.trim(),
    branchId: activeBranch,
    sellerId: document.getElementById('dc_seller').value,
    items: JSON.parse(JSON.stringify(docItems)),
    total
  };
  DB.documents.push(rec);
  if(document.getElementById('dc_recordSale').checked){
    rec.items.forEach(it=>{
      const p = product(it.productId);
      DB.sales.push({id:uid('sa'), productId:it.productId, qty:it.qty, unitPrice:it.price, total:it.qty*it.price, unitCost:p?computeCosts(p):0, type:'Reja Reja', date:rec.date, customer:rec.customer, branchId:rec.branchId});
      if(p) p.currentStock = Math.max(0,(Number(p.currentStock)||0)-Number(it.qty||0));
    });
    toast('✅ Nyaraka imetengenezwa na mauzo yamerekodiwa');
  } else {
    toast('✅ Nyaraka imetengenezwa');
  }
  saveDB();
  printDocument(rec);
  docItems = [];
  render();
}

/* ================= PAYROLL ================= */
function payeTax(gross){
  // Approximate Tanzania monthly PAYE bands — verify current TRA rates before official use.
  if(gross<=270000) return 0;
  if(gross<=520000) return (gross-270000)*0.08;
  if(gross<=760000) return 20000+(gross-520000)*0.20;
  if(gross<=1000000) return 68000+(gross-760000)*0.25;
  return 128000+(gross-1000000)*0.30;
}
function payrollFor(e){
  const gross = Number(e.salary)||0;
  const d = e.deductions||{};
  let deductions = 0; const lines=[];
  if(d.nssf){ const v=gross*0.10; deductions+=v; lines.push(['NSSF (10%)',v]); }
  if(d.paye){ const v=payeTax(gross); deductions+=v; lines.push(['PAYE',v]); }
  if(d.health){ const v=gross*0.03; deductions+=v; lines.push(['Bima ya Afya (3%)',v]); }
  if(d.union){ const v=gross*0.02; deductions+=v; lines.push(['Chama cha Wafanyakazi (2%)',v]); }
  const net = gross-deductions;
  let employerCost = 0; const empLines=[];
  if(d.nssf){ const v=gross*0.10; employerCost+=v; empLines.push(['NSSF Mwajiri (10%)',v]); }
  if(d.wcf){ const v=gross*0.006; employerCost+=v; empLines.push(['WCF (0.6%)',v]); }
  if(d.sdl){ const v=gross*0.035; employerCost+=v; empLines.push(['SDL (3.5%)',v]); }
  return {gross, deductions, net, lines, employerCost, empLines};
}
function tabPayroll(){
  const list = filteredByBranch(DB.employees);
  const totals = list.reduce((a,e)=>{const p=payrollFor(e); a.gross+=p.gross;a.ded+=p.deductions;a.net+=p.net;a.emp+=p.employerCost;return a;},{gross:0,ded:0,net:0,emp:0});
  return `
  <div class="alert-box warn"><span class="ic">ℹ️</span><div>Viwango vya makato (NSSF, PAYE, WCF, SDL) vilivyotumika hapa ni vya kawaida/makadirio. Tafadhali linganisha na viwango rasmi vya sasa vya TRA/NSSF kabla ya kulipa mishahara rasmi.</div></div>
  <div class="grid g4" style="margin-bottom:16px;">
    <div class="card stat"><div class="label">Jumla Mishahara Ghafi</div><div class="num">${fmt(totals.gross)}</div></div>
    <div class="card stat danger"><div class="label">Jumla Makato</div><div class="num">${fmt(totals.ded)}</div></div>

    <div class="card stat"><div class="label">Gharama za Mwajiri (NSSF/WCF/SDL)</div><div class="num">${fmt(totals.emp)}</div></div>
  </div>
  <div class="card">
    <div class="card-title"><h2>Orodha ya Malipo</h2><button class="btn ghost sm" onclick="printSection('payTable','Ripoti ya Payroll')">🖨️ Chapisha Yote</button></div>
    <div class="table-wrap" id="payTable"><table>
      <thead><tr><th>Mfanyakazi</th><th>Mshahara Ghafi</th><th>Makato</th><th>Mshahara wa Mkono (Net)</th><th class="no-print"></th></tr></thead>
      <tbody>

function printPayslip(id){
  const e = DB.employees.find(x=>x.id===id); if(!e) return;
  const p = payrollFor(e); const s = DB.settings;
  const html = `<div class="doc-page">
    <div class="doc-head">
      <div style="display:flex;gap:12px;align-items:center;">${shopLogoHTML(50)}<div><div style="font-family:'Fraunces',serif;font-weight:800;font-size:19px;color:var(--forest);">${esc(s.shopName)}</div></div></div>
      <div class="doc-meta"><div class="doc-title">SLIPU YA MSHAHARA</div>Mwezi: ${todayStr().slice(0,7)}</div>
    </div>
    <p style="font-size:13.5px;"><b>${esc(e.name)}</b> — ${esc(e.position)}</p>
    <table class="doc-table"><thead><tr><th>Maelezo</th><th>Kiasi</th></tr></thead>
      <tbody>
      <tr><td>Mshahara wa Msingi</td><td>${fmt(p.gross)}</td></tr>
      ${p.lines.map(l=>`<tr><td>(-) ${l[0]}</td><td>(${fmt(l[1])})</td></tr>`).join('')}
      </tbody>
    </table>
    <div class="doc-total-row"><div class="doc-total-box"><div class="r final"><span>MSHAHARA WA MKONO</span><span>${fmt(p.net)}</span></div></div></div>
    ${e.signature?`<img src="${e.signature}" style="height:44px;object-fit:contain;margin-top:30px;" />`:''}
    <div class="sign-line">Sahihi</div>
  </div>`;
  document.getElementById('printArea').innerHTML = html;
  setTimeout(()=>window.print(),150);
}

/* ================= EXPENSES ================= */
function tabExpenses(){
  const list = filteredByBranch(DB.expenses).slice().reverse();
  const thisMonth = todayStr().slice(0,7);
  const monthTotal = list.filter(x=>monthKey(x.date)===thisMonth).reduce((a,x)=>a+Number(x.amount||0),0);
  return `
  <div class="grid g3" style="margin-bottom:16px;">
    <div class="card stat danger"><div class="label">Gharama Mwezi Huu</div><div class="num">${fmt(monthTotal)}</div></div>
    <div class="card stat"><div class="label">Idadi ya Miamala</div><div class="num">${list.length}</div></div>
    <div class="card stat" style="display:flex;align-items:center;justify-content:center;"><button class="btn gold" onclick="openExpenseModal()">➕ Ongeza Gharama</button></div>
  </div>
  <div class="card">
    <div class="card-title"><h2>Orodha ya Gharama</h2><button class="btn ghost sm" onclick="printSection('expTable','Ripoti ya Gharama za Uendeshaji')">🖨️ Chapisha</button></div>
    <div class="table-wrap" id="expTable"><table>
      <thead><tr><th>Tarehe</th><th>Aina</th><th>Maelezo</th><th>Kiasi</th><th>Tawi</th><th class="no-print"></th></tr></thead>
      <tbody>
      ${list.length===0?`<tr><td colspan="6"><div class="empty">Bado hakuna gharama zilizorekodiwa.</div></td></tr>`:''}
      ${list.map(x=>`<tr><td>${x.date}</td><td><span class="badge gray">${esc(x.category)}</span></td><td>${esc(x.note||'—')}</td><td>${fmt(x.amount)}</td><td>${esc(branchName(x.branchId))}</td>
      <td class="no-print"><button class="linebtn" onclick="deleteExpense('${x.id}')">✕</button></td></tr>`).join('')}
      </tbody>
    </table></div>
  </div>`;
}
function openExpenseModal(){
  if(!requireBranch()) return;
  const modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML=`<div class="modal">
    <div class="modal-head"><h2>🏢 Ongeza Gharama ya Uendeshaji — ${esc(branchName(activeBranch))}</h2><button class="xbtn" onclick="this.closest('.modal-bg').remove()">✕</button></div>
    <div class="field"><label>Aina ya Gharama</label><select id="ex_cat">${EXP_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
    <div class="row">
      <div class="field"><label>Kiasi</label><input id="ex_amount" type="number" value="0"></div>
      <div class="field"><label>Tarehe</label><input id="ex_date" type="date" value="${todayStr()}"></div>
    </div>
    <div class="field"><label>Maelezo (hiari)</label><input id="ex_note" type="text"></div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn gold" onclick="saveExpense()">💾 Hifadhi</button>
      <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Ghairi</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}
function saveExpense(){
  const amount = Number(document.getElementById('ex_amount').value)||0;
  if(amount<=0){ toast('⚠️ Weka kiasi sahihi'); return; }
  DB.expenses.push({id:uid('ex'), category:document.getElementById('ex_cat').value, amount, date:document.getElementById('ex_date').value||todayStr(), note:document.getElementById('ex_note').value.trim(), branchId: activeBranch});
  saveDB(); document.querySelector('.modal-bg').remove(); render(); toast('✅ Gharama imehifadhiwa');
}
function deleteExpense(id){ if(!requireEditDelete())return; if(!confirm('Futa gharama hii?'))return; DB.expenses=DB.expenses.filter(x=>x.id!==id); saveDB(); render(); toast('🗑️ Imefutwa'); }

/* ================= BRANCHES ================= */
function tabBranches(){
  return `
  <div class="alert-box ok"><span class="ic">🏬</span><div>Kila tawi ni <b>biashara inayojitegemea</b>: bidhaa, mauzo, manunuzi, wateja, wasambazaji, wafanyakazi na gharama za tawi moja HAZIONEKANI kwenye tawi lingine. Chagua "Muhtasari wa Matawi Yote" juu kushoto ukitaka kuona jumla ya matawi yote pamoja (kwa ajili ya uongozi tu).</div></div>
  <div class="card-title" style="margin-bottom:14px;"><div></div><button class="btn gold" onclick="openBranchModal()">➕ Ongeza Tawi</button></div>
  <div class="grid g3">
    ${DB.branches.length===0?`<div class="card empty">Bado hakuna tawi. Ongeza tawi la kwanza (mfano: Tawi la Dodoma Mjini).</div>`:''}
    ${DB.branches.map(b=>{
      const prods = DB.products.filter(p=>p.branchId===b.id).length;
      const sales = DB.sales.filter(s=>s.branchId===b.id).length;
      return `<div class="card ${activeBranch===b.id?'':''}" style="${activeBranch===b.id?'border-color:var(--gold);':''}">
        <h3>📍 ${esc(b.name)} ${activeBranch===b.id?'<span class="badge ok">Inatumika Sasa</span>':''}</h3>
        <div class="hint">${esc(b.region)} — ${esc(b.street)}</div>
        <div style="margin-top:10px;font-size:12.5px;color:var(--muted);">${prods} bidhaa · ${sales} mauzo yaliyorekodiwa</div>
        <div style="margin-top:12px;display:flex;gap:8px;">
          <button class="btn ghost sm" onclick="setBranch('${b.id}');goTab('dashboard')">Fungua Tawi Hili</button>
          <button class="linebtn" onclick="deleteBranch('${b.id}')">✕ Futa</button>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}
function openBranchModal(){
  const modal=document.createElement('div'); modal.className='modal-bg';
  modal.innerHTML=`<div class="modal">
    <div class="modal-head"><h2>📍 Ongeza Tawi Jipya</h2><button class="xbtn" onclick="this.closest('.modal-bg').remove()">✕</button></div>
    <div class="field"><label>Jina la Tawi</label><input id="br_name" type="text" placeholder="mfano: KCL - Dodoma Mjini"></div>
    <div class="field"><label>Mkoa</label><select id="br_region">${REGIONS.map(r=>`<option>${r}</option>`).join('')}</select></div>
    <div class="field"><label>Mtaa/Eneo</label><input id="br_street" type="text" placeholder="mfano: Area C, Kikuyu Kwa Rose"></div>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn gold" onclick="saveBranch()">💾 Hifadhi</button>
      <button class="btn ghost" onclick="this.closest('.modal-bg').remove()">Ghairi</button>
    </div>
  </div>`;
  document.body.appendChild(modal);
}
function saveBranch(){
  const name = document.getElementById('br_name').value.trim();
  if(!name){ toast('⚠️ Weka jina la tawi'); return; }
  DB.branches.push({id:uid('br'), name, region:document.getElementById('br_region').value, street:document.getElementById('br_street').value.trim()});
  saveDB(); document.querySelector('.modal-bg').remove(); render(); toast('✅ Tawi limeongezwa');
}
function deleteBranch(id){
  if(!requireEditDelete()) return;
  if(!confirm('Futa tawi hili? Data ya bidhaa/mauzo iliyounganishwa nalo haitafutwa lakini haitakuwa na tawi.')) return;
  DB.branches = DB.branches.filter(b=>b.id!==id);
  if(activeBranch===id) activeBranch='all';
  saveDB(); render(); toast('🗑️ Tawi limefutwa');
}

function tabStaffAccounts(){
  const staff = DB.staffAccounts||[];
  return `
  <div class="card" style="margin-top:16px;">
    <div class="card-title"><h2>👥 Wafanyakazi Wenye Akaunti ya Kuingia Mfumoni</h2></div>
    <p class="hint">Unda akaunti ya kuingia kwa mfanyakazi (mgavi, mhasibu, sales officer, meneja, n.k). Watatumia barua pepe na nenosiri hili kuingia — wataona data ile ile ya biashara yako.</p>
    <div class="row" style="margin-top:10px;">
      <div class="field"><label>Barua Pepe ya Mfanyakazi</label><input id="sa_email" type="email" placeholder="mfano@gmail.com"></div>
      <div class="field"><label>Jina Lake</label><input id="sa_name" type="text" placeholder="Jina kamili"></div>
    </div>
    <div class="row">
      <div class="field"><label>Nenosiri la Muda (mpe mfanyakazi)</label><input id="sa_pass" type="text" placeholder="Angalau herufi 6"></div>
      <div class="field"><label>Cheo</label>
        <select id="sa_role">
          <option>Mgavi</option><option>Mhasibu</option><option>Sales Officer</option>
          <option>Meneja</option><option>Mfanyakazi Mwingine</option>
        </select>
      </div>
    </div>
    <div class="field" style="flex-direction:row;align-items:center;gap:8px;">
      <input type="checkbox" id="sa_canEditDelete" style="width:auto;">
      <label style="margin:0;" for="sa_canEditDelete">Mpe ruhusa ya kuhariri na kufuta taarifa (si wote wanaostahili hii)</label>
    </div>
    <button class="btn gold" onclick="addStaffAccountUI()">➕ Tengeneza Akaunti ya Mfanyakazi</button>
    <div id="sa-msg" style="display:none;margin-top:8px;font-size:13px;font-weight:600;padding:8px 10px;border-radius:6px;"></div>

    <div class="section-title" style="margin-top:18px;"><h2 style="font-size:13px;">Orodha ya Wafanyakazi Wenye Akaunti</h2><div class="line"></div></div>
    ${staff.length===0?'<p class="hint">Hakuna mfanyakazi mwenye akaunti bado.</p>':`
      <table class="tbl"><thead><tr><th>Jina</th><th>Barua Pepe</th><th>Cheo</th><th>Ruhusa ya Kuhariri/Kufuta</th><th>Tarehe</th><th></th></tr></thead>
      <tbody>${staff.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>${esc(x.role)}</td><td>${x.canEditDelete?'<span class="badge green">Ndiyo</span>':'<span class="badge">Hapana</span>'}</td><td>${esc((x.createdAt||'').slice(0,10))}</td><td><button class="btn ghost sm" onclick="toggleStaffEditDelete('${x.uid}')">${x.canEditDelete?'Ondoa Ruhusa':'Ruhusu Kuhariri/Kufuta'}</button></td></tr>`).join('')}</tbody></table>
      <p class="hint" style="margin-top:8px;">Kuondoa mfanyakazi kabisa (kuzuia asiingie tena), wasiliana na msaidizi wako wa kiufundi kufanya hivyo kwenye Firebase Console.</p>
    `}
  </div>`;
}
async function toggleStaffEditDelete(uid){
  const acc = (DB.staffAccounts||[]).find(x=>x.uid===uid);
  if(!acc) return;
  acc.canEditDelete = !acc.canEditDelete;
  await saveDBToCloud();
  render();
  toast(acc.canEditDelete ? '✅ Amepewa ruhusa ya kuhariri/kufuta' : 'Ruhusa imeondolewa');
}
async function addStaffAccountUI(){
  const email=document.getElementById('sa_email').value.trim();
  const name=document.getElementById('sa_name').value.trim();
  const pass=document.getElementById('sa_pass').value;
  const role=document.getElementById('sa_role').value;
  const msg=document.getElementById('sa-msg');
  if(!email||!name||!pass){
    msg.style.display='block'; msg.style.background='#FBEBE5'; msg.style.color='#B3432B';
    msg.textContent='Jaza barua pepe, jina na nenosiri.'; return;
  }
  if(pass.length<6){
    msg.style.display='block'; msg.style.background='#FBEBE5'; msg.style.color='#B3432B';
    msg.textContent='Nenosiri liwe na herufi angalau 6.'; return;
  }
  msg.style.display='block'; msg.style.background='#FBF2DE'; msg.style.color='#B9821F';
  msg.textContent='⏳ Inatengeneza akaunti...';
  const canEditDelete = document.getElementById('sa_canEditDelete').checked;
  const res = await createStaffAccount(email, pass, name, role, canEditDelete);
  if(res.ok){
    msg.style.background='#E7F1EA'; msg.style.color='#2E6B4F';
    msg.textContent=`✅ Akaunti ya ${name} imetengenezwa. Mpe barua pepe: ${email} na nenosiri: ${pass}`;
    render();
  } else {
    msg.style.background='#FBEBE5'; msg.style.color='#B3432B';
    msg.textContent='❌ '+res.error;
  }
}
async function uploadShopLogo(input){
  const file = input.files[0]; if(!file) return;
  const b64 = await fileToBase64(file);
  DB.settings.logoImage = b64;
  await saveDB(); render(); toast('✅ Logo imepakiwa');
}
function removeShopLogo(){
  DB.settings.logoImage = '';
  saveDB(); render(); toast('🗑️ Logo imeondolewa, mfumo utatumia logo chaguo-msingi');
}
function saveSettings(){
  DB.settings.shopName = document.getElementById('st_name').value.trim()||'KCL';
  DB.settings.phones = document.getElementById('st_phones').value.trim();
  DB.settings.address = document.getElementById('st_address').value.trim();
  DB.settings.tin = document.getElementById('st_tin').value.trim();
  DB.settings.vrn = document.getElementById('st_vrn').value.trim();
  DB.settings.email = document.getElementById('st_email').value.trim();
  DB.settings.defaultTax = Number(document.getElementById('st_tax').value)||0;
  DB.settings.defaultRetailMargin = Number(document.getElementById('st_rm').value)||0;
  DB.settings.defaultWholesaleMargin = Number(document.getElementById('st_wm').value)||0;
  saveDB(); render(); toast('✅ Mipangilio imehifadhiwa');
}
function exportData(){
  const blob = new Blob([JSON.stringify(DB,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`kcl-backup-${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
}

/* ================= BOOT (called after login, see Firebase auth handler) ================= */
async function boot(){
  document.getElementById('app').innerHTML = `<div style="padding:60px;text-align:center;color:#173C30;font-family:'Fraunces',serif;">Inapakia mfumo wa KCL...</div>`;
  await loadDB();
  if(DB.branches.length===0){
    DB.branches.push({id:uid('br'), name:'KCL - Tawi Kuu', region:'Dodoma', street:'Mtaa Mkuu'});
    await saveDB();
  }
  if(activeBranch==='all' && DB.branches.length>0) activeBranch = DB.branches[0].id;
  render();
}
</script>
